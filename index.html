<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comment-section</title>
  </head>
  <body class="bg-very-light-gray h-screen">
    <main class="max-w-3xl mx-auto py-10">
      <div id="comments" class="space-y-5"></div>

      <div class="bg-white p-6 rounded-xl mt-5 flex gap-5 items-start">
        <img src="./public/image-juliusomo-GOpOiOke.webp" class="w-10 h-10" />

        <textarea
          id="commentInput"
          placeholder="Add a comment..."
          class="flex-1 border rounded-lg p-3 h-28 resize-none outline-none"
        ></textarea>

        <button
          id="sendComment"
          class="bg-moderate-blue hover:bg-violet-400 text-white px-7 py-3 rounded-lg"
        >
          SEND
        </button>
      </div>
    </main>

    <div
      id="deleteModal"
      class="fixed inset-0 bg-black/50 hidden justify-center items-center"
    >
      <div class="bg-white rounded-xl p-6 w-[400px]">
        <h2 class="text-xl font-bold mb-4">Delete comment</h2>

        <p class="text-gray-500 mb-5">
          Are you sure you want to delete this comment? This will remove the
          comment and can't be undone.
        </p>

        <div class="flex justify-between">
          <button
            id="cancelDelete"
            class="bg-gray-500 text-white px-5 py-3 rounded-lg"
          >
            NO, CANCEL
          </button>

          <button
            id="confirmDelete"
            class="bg-red-500 text-white px-5 py-3 rounded-lg"
          >
            YES, DELETE
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
